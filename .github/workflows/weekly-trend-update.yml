name: Weekly Trend Updater

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 오전 9시 (KST)
  workflow_dispatch:      # 수동 실행도 가능

jobs:
  update-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create .env.local from secrets
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env.local
          echo "NEXT_PUBLIC_NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env.local
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env.local

      - name: Run trend updater
        run: python scripts/trend_updater.py

      - name: Push if changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add src/data/spots/ && git commit -m "feat: weekly trending spots update [skip ci]" && git push)
