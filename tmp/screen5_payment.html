<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "accent-purple": "#7c3aed",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1a1814",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">케이젬 결제하기</h2>
<div class="flex w-12 items-center justify-end">
<p class="text-primary text-xs font-bold leading-normal tracking-wide shrink-0">KO/EN/ZH/JA</p>
</div>
</div>
<div class="px-4 py-2">
<!-- Product Card -->
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-slate-100 dark:bg-primary/5 border border-slate-200 dark:border-primary/10 p-4 shadow-sm">
<div class="flex flex-col gap-1 flex-[2_2_0px]">
<p class="text-primary text-xs font-bold uppercase tracking-wider">Premium Access</p>
<p class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight">24시간 시크릿 패스</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">전 세계 시크릿 패스 무제한 이용권</p>
</div>
<div class="w-24 h-24 bg-center bg-no-repeat bg-cover rounded-lg shrink-0 border border-primary/20" data-alt="Luxury night city skyline with purple lights" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCaIVVceCbB3LPqmwAjMFHd5v62ZMoLlrUPPY9lSiQYSMfryMaFXrochpv2pQqntEoD7ttcAVpg9qWbzXi1AJW09Z5ZyCKIcQi3Q9VLGxVKvJY9dHaJzAIWLW2OM7GtDqc_j8G84zvXcDgWQfggmFZZNC9mtUqGgyNJMEO2fIeN7azLT1aalWfOOehqCFWZuGmHlmF-9wF2xKtvvwjr3T6m0FvFy0yvWAXh3E65r46Q5uMwLJgzcBntEh6g2lx6_BUp5OGjhQVZaPXi");'>
</div>
</div>
</div>
<!-- Order Summary Section -->
<div class="px-4 pt-6 pb-2">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">receipt_long</span>
                주문 요약
            </h3>
<div class="space-y-3 bg-slate-50 dark:bg-slate-900/40 p-4 rounded-xl border border-slate-100 dark:border-slate-800">
<div class="flex justify-between items-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">시크릿 패스 이용권</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium">₩55,000</p>
</div>
<div class="flex justify-between items-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">서비스 수수료</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium">₩5,500</p>
</div>
<div class="h-px bg-slate-200 dark:bg-slate-800 my-1"></div>
<div class="flex justify-between items-center pt-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold">총 결제 금액</p>
<p class="text-primary text-xl font-bold">₩60,500</p>
</div>
</div>
</div>
<!-- Payment Methods -->
<div class="px-4 pt-6">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight mb-4">결제 수단 선택</h3>
<div class="grid grid-cols-3 gap-3 mb-6">
<button class="flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-primary border-2 border-primary text-background-dark">
<span class="material-symbols-outlined mb-1">credit_card</span>
<span class="text-xs font-bold">카드 결제</span>
</button>
<button class="flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined mb-1">ios</span>
<span class="text-xs font-bold">Apple Pay</span>
</button>
<button class="flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined mb-1">google</span>
<span class="text-xs font-bold">Google Pay</span>
</button>
</div>
<!-- Card Form -->
<div class="space-y-4 mb-8">
<div>
<label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1 uppercase tracking-wide">카드 번호</label>
<div class="relative">
<input class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-xl py-3 px-4 focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1 uppercase tracking-wide">유효 기간 (MM/YY)</label>
<input class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-xl py-3 px-4 focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="12/28" type="text"/>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1 uppercase tracking-wide">CVV</label>
<input class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-xl py-3 px-4 focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="***" type="password"/>
</div>
</div>
</div>
</div>
<!-- Security Badges -->
<div class="flex justify-center gap-6 px-4 mb-8">
<div class="flex items-center gap-1.5 grayscale opacity-60">
<span class="material-symbols-outlined text-green-500 text-sm">verified_user</span>
<span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter">Secure SSL</span>
</div>
<div class="flex items-center gap-1.5 grayscale opacity-60">
<span class="material-symbols-outlined text-blue-500 text-sm">encrypted</span>
<span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter">PCI DSS Compliant</span>
</div>
</div>
<!-- Fixed Bottom Button Area -->
<div class="mt-auto p-4 pb-8 sticky bottom-0 bg-background-light/95 dark:bg-background-dark/95 border-t border-slate-200 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark py-4 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>₩60,500 결제하기</span>
<span class="material-symbols-outlined">payments</span>
</button>
<p class="text-[10px] text-center text-slate-500 dark:text-slate-500 mt-4 leading-relaxed">
                결제 시 케이젬의 이용약관 및 개인정보 처리방침에 동의하게 됩니다.<br/>모든 정보는 암호화되어 안전하게 처리됩니다.
            </p>
</div>
</div>
</body></html>
