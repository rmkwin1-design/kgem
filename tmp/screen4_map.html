<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "accent-purple": "#7c4dff",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1a1812",
                        "card-dark": "#2a271e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .map-gradient {
            background: radial-gradient(circle at center, #2a271e 0%, #1a1812 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex min-h-screen flex-col overflow-x-hidden">
<!-- Header -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 border-b border-primary/10 justify-between sticky top-0 z-20">
<div class="flex items-center gap-4">
<div class="text-primary flex size-10 items-center justify-center rounded-full bg-primary/10">
<span class="material-symbols-outlined">menu</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">K-GEM</h2>
</div>
<div class="flex items-center gap-2">
<span class="text-primary/70 text-xs font-bold tracking-widest bg-primary/5 px-3 py-1.5 rounded-full border border-primary/20">KO/EN/ZH/JA</span>
</div>
</header>
<!-- Search Bar Overlay -->
<div class="px-4 py-3 absolute top-20 left-0 right-0 z-10 pointer-events-none">
<label class="flex flex-col w-full pointer-events-auto">
<div class="flex w-full items-stretch rounded-xl h-14 shadow-2xl bg-white dark:bg-card-dark border border-primary/20">
<div class="text-primary flex items-center justify-center pl-4 rounded-l-xl">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full border-none bg-transparent focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 px-4 text-base font-medium" placeholder="장소 검색" value="경복궁"/>
<div class="flex items-center pr-4">
<span class="material-symbols-outlined text-accent-purple">mic</span>
</div>
</div>
</label>
</div>
<!-- Map Area -->
<main class="flex-1 relative min-h-[500px] map-gradient overflow-hidden">
<!-- Simulated Map Background -->
<div class="absolute inset-0 opacity-40 mix-blend-overlay" data-alt="Dark stylized map of Seoul streets" data-location="Seoul Gyeongbokgung" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCq_V7kaWJsfAIirOVujjcMA5q8IPuBHZYjVLZlEepNcdWkh8mt65O05AbA3FF8AdW_ePgHQxAV-BOo0-eNX_SXxF1l9OEPbJADUFvYJm98FNHDMVktJwOhOu8f2JL2hh5k5XwdCF0MF_QbmxqNc0ZcPXA172z30blD2k_c5_esjFLQ4xAXZ7mlWrW7NJBx59b4rsP_5H6nIDdRMhKYP6NjQWLx_ILm72Y6W6z7XuaT1nRPvBr-9z-qaw88MnkI5fWqn38aQi6AknZW'); background-size: cover; background-position: center;"></div>
<!-- Route Line Decoration -->
<svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" viewbox="0 0 400 800">
<path d="M100,600 Q150,500 250,450 T300,200" fill="none" stroke="#d4af35" stroke-dasharray="10 15" stroke-linecap="round" stroke-width="6"></path>
<circle cx="300" cy="200" fill="#7c4dff" r="8"></circle>
</svg>
<!-- Map Controls -->
<div class="absolute right-4 top-40 flex flex-col gap-3">
<div class="flex flex-col rounded-full bg-white dark:bg-card-dark shadow-xl border border-primary/10 overflow-hidden">
<button class="flex size-12 items-center justify-center border-b border-primary/5 hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary">add</span>
</button>
<button class="flex size-12 items-center justify-center hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary">remove</span>
</button>
</div>
<button class="flex size-12 items-center justify-center rounded-full bg-white dark:bg-card-dark shadow-xl border border-primary/10 text-accent-purple">
<span class="material-symbols-outlined">near_me</span>
</button>
<button class="flex size-12 items-center justify-center rounded-full bg-white dark:bg-card-dark shadow-xl border border-primary/10 text-primary">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
<!-- Navigation Instruction Floating -->
<div class="absolute left-4 top-40 z-10">
<div class="bg-accent-purple text-white px-5 py-3 rounded-2xl shadow-lg flex items-center gap-3 animate-pulse">
<span class="material-symbols-outlined text-3xl">turn_right</span>
<div>
<p class="text-[10px] uppercase font-bold opacity-80 tracking-tighter">Next Step</p>
<p class="font-bold text-sm">세종대로 방면 우회전</p>
</div>
</div>
</div>
</main>
<!-- Navigation Card -->
<div class="p-4 bg-background-light dark:bg-background-dark relative z-20">
<div class="flex flex-col items-stretch rounded-2xl shadow-2xl bg-white dark:bg-card-dark border border-primary/20 overflow-hidden">
<div class="flex flex-col @xl:flex-row">
<div class="w-full @xl:w-1/3 bg-center bg-no-repeat aspect-video @xl:aspect-square bg-cover relative" data-alt="Traditional Korean palace gate at night" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCNKKTGtkBUKim6PBKahQfkR4J-6nPIHx0HKI6fFNsHYgcFhc6Iqf4aZCggFM0hXkPt-105gB1J7WUj3hvmsrOTMuuHy_mfeqfealcSOKNkwzNCfRRI5oroRychSAz0TfQhVq-rzM45YkhdfcIsBxQmFIXAKFJiD264_FpdcYgEjXUI-ogdXfOXTNZ23XvRzQyp3OK4SDRhIO3Vvm6yvrHPUnPT0ZbLtSQsuDLVy_wSFhXK5_3GjMgwuCnIv_ShAlFHeVHoNQKNmuSa");'>
<div class="absolute inset-0 bg-gradient-to-t from-card-dark/80 to-transparent"></div>
<div class="absolute bottom-3 left-4">
<span class="bg-accent-purple text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Destination</span>
</div>
</div>
<div class="flex flex-1 flex-col p-5">
<div class="flex justify-between items-start mb-2">
<h3 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">경복궁 (Gyeongbokgung Palace)</h3>
<button class="text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">share</span>
</button>
</div>
<div class="space-y-3">
<div class="flex items-center gap-2">
<span class="flex h-2 w-2 rounded-full bg-green-500"></span>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">이동 중 (En Route) • 12 min (3.4km)</p>
</div>
<div class="bg-primary/5 p-4 rounded-xl border-l-4 border-primary">
<p class="text-slate-700 dark:text-slate-200 text-base font-semibold">세종대로 방면으로 우회전하세요</p>
<p class="text-slate-400 dark:text-slate-500 text-xs mt-1">300m 앞에서 방향 전환</p>
</div>
</div>
<div class="mt-6 flex gap-3">
<button class="flex-1 cursor-pointer items-center justify-center rounded-full h-12 px-6 bg-primary hover:bg-primary/90 text-background-dark text-base font-bold transition-all shadow-lg shadow-primary/20">
                                길 안내 시작
                            </button>
<button class="flex size-12 cursor-pointer items-center justify-center rounded-full border-2 border-primary/30 text-primary hover:bg-primary/10 transition-all">
<span class="material-symbols-outlined">favorite</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom NavBar -->
<nav class="flex gap-2 border-t border-primary/10 bg-white dark:bg-card-dark px-4 pb-8 pt-3 sticky bottom-0 z-30">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-1">map</span>
<p class="text-[10px] font-bold uppercase tracking-widest">지도</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">explore</span>
<p class="text-[10px] font-bold uppercase tracking-widest">탐색</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<p class="text-[10px] font-bold uppercase tracking-widest">일정</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">settings</span>
<p class="text-[10px] font-bold uppercase tracking-widest">설정</p>
</a>
</nav>
</div>
</body></html>
